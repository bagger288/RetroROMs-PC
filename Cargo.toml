[package]
name = "retroms-desktop"
version = "1.0.0"
edition = "2021"
authors = ["RetroROMs Contributors"]
description = "Native cross-platform desktop catalog manager and ROM downloader for Emu-Land.net"

[lib]
name = "retroms_desktop"
path = "src/lib.rs"

[[bin]]
name = "retroms-desktop"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "gzip", "brotli", "rustls-tls"] }
scraper = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = { version = "2.1", default-features = false, features = ["deflate"] }
rfd = "0.14"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
regex = "1.10"
chrono = "0.4"
futures-util = "0.3"
bytes = "1.6"

[build-dependencies]
winres = "0.1"
