[package]
name = "retroms-desktop"
version = "1.0.0"
edition = "2021"
description = "RetroROMs - Desktop PC Port for Emu-Land.net"
authors = ["RetroROMs Team"]

[lib]
name = "retroms_desktop"
path = "src/lib.rs"

[[bin]]
name = "retroms-desktop"
path = "src/main.rs"

[dependencies]
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
slint = { version = "1.9", default-features = true }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
open = "5.4"
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "cookies", "gzip", "rustls-tls"] }
rfd = "0.14"
rusqlite = { version = "0.31", features = ["bundled"] }
scraper = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
zip = { version = "2.4", default-features = false, features = ["deflate", "bzip2"] }

[build-dependencies]
slint-build = "1.9"
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
